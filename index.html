<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><title>CommitteeMate</title><style>
:root{--navy:#102a43;--blue:#1769aa;--bg:#f3f6fa;--border:#dbe3ec}*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:var(--bg);color:#182230}header{background:var(--navy);color:white;padding:18px 16px;position:sticky;top:0}main{max-width:850px;margin:auto;padding:14px}h1{font-size:21px;margin:0}h2{font-size:17px;margin:0 0 12px}.panel{background:white;border:1px solid var(--border);border-radius:16px;padding:16px;margin:12px 0}.muted{color:#64748b;font-size:13px}.hidden{display:none!important}label{display:block;font-size:13px;margin:10px 0 5px}input,button{font:inherit;width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;background:white}button{background:var(--blue);border:0;color:white;font-weight:650;margin-top:10px}button.secondary{background:#e8eef5;color:#18324a}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{padding:14px;border-radius:13px;background:#eef5fb}.stat b{display:block;font-size:22px}.pill{display:inline-block;padding:4px 9px;border-radius:99px;font-size:12px;background:#edf2f7}.paid{background:#d8f5e5;color:#12643e}.pending{background:#fff0c2;color:#875b00}.partial{background:#ffe4d6;color:#9a3412}.item{border-top:1px solid var(--border);padding:12px 0}.notice{background:#fff7db;padding:11px;border-radius:10px;font-size:13px}.error{color:#c0392b;white-space:pre-wrap}.success{color:#138a55}.wheel{border:4px solid #d8e8f8;border-radius:50%;width:min(72vw,280px);height:min(72vw,280px);display:flex;align-items:center;justify-content:center;margin:16px auto;background:conic-gradient(#f8c15c 0 60deg,#8bd5ca 60deg 120deg,#8db8f5 120deg 180deg,#e8a6c8 180deg 240deg,#b8dfa0 240deg 300deg,#c3b3f2 300deg 360deg);text-align:center;padding:30px;font-weight:800}nav{display:flex;gap:7px;overflow:auto;padding:8px 0}nav button{white-space:nowrap;width:auto;margin:0;padding:9px 12px}nav button.active{background:#102a43}.small{width:auto;padding:7px 10px;font-size:12px}.footer{text-align:center;color:#64748b;font-size:12px;padding:20px}@media(min-width:620px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style></head><body><header><h1>🎯 CommitteeMate</h1><div class="muted" style="color:#d7e3ee">Monthly committee • member records • UPI payments</div></header><main><section id="login" class="panel"><h2>Login to your committee</h2><p class="muted">Use the username and password provided by your admin.</p><label>Username (admin can use email)</label><input id="username" autocomplete="username" placeholder="e.g. dipu or admin email"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn">Login</button><div id="loginMsg" class="error"></div><p class="muted">New member? Ask your admin to create your login.</p></section><section id="app" class="hidden"><div class="row"><div><b id="hello">Welcome</b><div id="roleLabel" class="muted"></div></div><button id="logoutBtn" class="secondary" style="flex:0 0 auto;width:auto">Log out</button></div><nav id="tabs"></nav><div id="view"></div></section><div class="footer">UPI payments are not auto-verified. Admin must check the actual transaction.</div></main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';import{getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';import{getFirestore,doc,getDoc,collection,query,where,getDocs,addDoc,updateDoc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';
// Paste Firebase web config here before deployment.
const firebaseConfig={apiKey:'AIzaSyCYZTMrtRtqLQztceOWd_vH9syvoP9kP_i7Q',authDomain:'committeemate01.firebaseapp.com',projectId:'committeemate01',storageBucket:'committeemate01.firebasestorage.app',messagingSenderId:'33242480535',appId:'1:33242480535:web:2cfe3a61862568a19aced2'};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),memberApp=initializeApp(firebaseConfig,'memberCreator'),memberAuth=getAuth(memberApp);const $=id=>document.getElementById(id);let user=null,profile=null,tab='home',members=[],payments=[],settings={};const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');const monthNow=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const emailFor=u=>{const value=String(u).trim().toLowerCase();return value.includes('@')?value:`${value}@login.committeemate.invalid`};function message(id,t,cls='error'){$(id).className=cls;$(id).textContent=t}function err(e){return e?.code==='auth/invalid-credential'?'Username or password is incorrect.':(e?.message||'Something went wrong.')}const admin=()=>profile?.role==='admin';
$('loginBtn').onclick=async()=>{try{message('loginMsg','Signing in…','muted');await signInWithEmailAndPassword(auth,emailFor($('username').value),$('password').value)}catch(e){message('loginMsg',err(e))}};$('logoutBtn').onclick=()=>signOut(auth);onAuthStateChanged(auth,async u=>{user=u;if(!u){$('login').classList.remove('hidden');$('app').classList.add('hidden');return}try{let s=await getDoc(doc(db,'users',u.uid));if(!s.exists())throw Error('Profile not set up. Ask admin.');profile=s.data();if(!['admin','member'].includes(profile.role))throw Error('Invalid role.');$('login').classList.add('hidden');$('app').classList.remove('hidden');$('hello').textContent='Hi, '+(profile.displayName||profile.username||'there');$('roleLabel').textContent=admin()?'Administrator':'Member account';tab='home';await refresh();drawTabs();render()}catch(e){await signOut(auth);$('login').classList.remove('hidden');message('loginMsg',err(e))}});
async function refresh(){let s=await getDoc(doc(db,'settings','main'));settings=s.exists()?s.data():{};if(admin()){let [m,p]=await Promise.all([getDocs(collection(db,'members')),getDocs(collection(db,'payments'))]);members=m.docs.map(d=>({id:d.id,...d.data()}));payments=p.docs.map(d=>({id:d.id,...d.data()}))}else{let m=await getDoc(doc(db,'members',profile.memberId));members=m.exists()?[{id:m.id,...m.data()}]:[];let p=await getDocs(query(collection(db,'payments'),where('memberUid','==',user.uid)));payments=p.docs.map(d=>({id:d.id,...d.data()}))}}
function tabList(){return admin()?[['home','Dashboard'],['members','Members'],['payments','Payments'],['wheel','Winner wheel'],['settings','Settings']]:[['home','My dashboard'],['payments','My payments'],['pay','Pay admin']]};function drawTabs(){$('tabs').innerHTML=tabList().map(([id,t])=>`<button class="${id===tab?'active':''}" data-tab="${id}">${t}</button>`).join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;drawTabs();render()})}function render(){let v=$('view');if(tab==='home')return home(v);if(tab==='members'&&admin())return memberView(v);if(tab==='payments')return paymentView(v);if(tab==='pay'&&!admin())return payView(v);if(tab==='wheel'&&admin())return wheelView(v);if(tab==='settings'&&admin())return settingsView(v);home(v)}
function home(v){let ex=payments.reduce((a,p)=>a+Number(p.dueAmount||0),0),rec=payments.reduce((a,p)=>a+Number(p.receivedAmount||0),0);v.innerHTML=`<div class="grid"><div class="stat"><span class="muted">${admin()?'Members':'Your record'}</span><b>${admin()?members.length:esc(members[0]?.name||'Not linked')}</b></div><div class="stat"><span class="muted">Expected</span><b>${money(ex)}</b></div><div class="stat"><span class="muted">Received</span><b>${money(rec)}</b></div><div class="stat"><span class="muted">Pending</span><b>${money(Math.max(0,ex-rec))}</b></div></div><div class="panel"><h2>${admin()?'Quick actions':'Your committee status'}</h2>${admin()?'<button id="goMembers">＋ Add member</button><button id="goDues" class="secondary">＋ Create monthly dues</button>':`<p>Monthly contribution: <b>${money(members[0]?.monthlyAmount)}</b></p><p>Due day: <b>${esc(members[0]?.dueDay||'Not set')}</b></p><button id="goPay">Pay admin by UPI</button>`}</div>`;if(admin()){$('goMembers').onclick=()=>{tab='members';drawTabs();render()};$('goDues').onclick=createDues}else $('goPay').onclick=()=>{tab='pay';drawTabs();render()}}
function memberView(v){v.innerHTML=`<div class="panel"><h2>Add member (maximum 20)</h2><div class="row"><div><label>Full name</label><input id="mName"></div><div><label>Username (3–24 chars)</label><input id="mUser"></div></div><div class="row"><div><label>Temporary password (6+ chars)</label><input id="mPass" type="password"></div><div><label>Monthly amount ₹</label><input id="mAmount" type="number" min="1"></div></div><div class="row"><div><label>Due day (1–28)</label><input id="mDue" type="number" min="1" max="28" value="5"></div><div><label>Phone (optional)</label><input id="mPhone"></div></div><button id="addMember">Create member login</button><div id="memberMsg" class="muted"></div></div><div class="panel"><h2>Members (${members.length}/20)</h2>${members.map(m=>`<div class="item"><b>${esc(m.name)}</b> <span class="pill">${money(m.monthlyAmount)}/month</span><div class="muted">Username: ${esc(m.username)} • Due day: ${esc(m.dueDay)}</div></div>`).join('')||'No members yet.'}</div>`;$('addMember').onclick=async()=>{try{if(members.length>=20)throw Error('Maximum 20 members.');let p={name:$('mName').value.trim(),username:$('mUser').value.trim().toLowerCase(),password:$('mPass').value,monthlyAmount:Number($('mAmount').value),dueDay:Number($('mDue').value),phone:$('mPhone').value.trim()};if(!p.name||!p.username||p.password.length<6||p.monthlyAmount<=0||p.dueDay<1||p.dueDay>28)throw Error('Fill required fields; password 6+ chars; due day 1–28.');message('memberMsg','Creating account…','muted');const cred=await createUserWithEmailAndPassword(memberAuth,emailFor(p.username),p.password);const uid=cred.user.uid;await setDoc(doc(db,'users',uid),{role:'member',username:p.username,displayName:p.name,memberId:uid});await setDoc(doc(db,'members',uid),{uid,name:p.name,username:p.username,monthlyAmount:p.monthlyAmount,dueDay:p.dueDay,phone:p.phone,lastWinnerCycle:null});await signOut(memberAuth);await refresh();render();message('memberMsg','Member created. Share login details privately.','success')}catch(e){message('memberMsg',err(e))}}}
async function createDues(){try{let month=prompt('Month YYYY-MM',monthNow());if(!month||!/^[0-9]{4}-[0-9]{2}$/.test(month))return;let n=0;for(let m of members){if(!payments.some(p=>p.memberUid===m.uid&&p.month===month)){await addDoc(collection(db,'payments'),{memberUid:m.uid,memberId:m.id,month,dueAmount:Number(m.monthlyAmount||0),receivedAmount:0,status:'pending',createdAt:serverTimestamp()});n++}}await refresh();render();alert(`Created ${n} monthly dues.`)}catch(e){alert(err(e))}}
function paymentView(v){v.innerHTML=`<div class="panel">${admin()?`<h2>All member payments</h2><button id="createDues">Create dues for ${monthNow()}</button>`:'<h2>Your monthly payments</h2>'}${payments.slice().sort((a,b)=>(b.month||'').localeCompare(a.month||'')).map(p=>{let m=members.find(x=>x.uid===p.memberUid);return `<div class="item"><div class="row"><div><b>${esc(admin()?(m?.name||'Member'):p.month)}</b><div class="muted">${esc(p.month)} • Due ${money(p.dueAmount)} • Received ${money(p.receivedAmount)}</div></div><span class="pill ${esc(p.status||'pending')}">${esc((p.status||'pending').toUpperCase())}</span></div>${admin()?`<button class="small secondary" data-edit="${p.id}">Update amount/status</button>`:''}</div>`}).join('')||'<p class="muted">No payments yet.</p>'}</div>${admin()?'<div class="panel"><h2>UPI payment references</h2><div id="requests">Loading…</div></div>':''}`;if(admin()){$('createDues').onclick=createDues;$('view').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editPayment(b.dataset.edit));loadRequests()}}
async function editPayment(id){let p=payments.find(x=>x.id===id);let n=prompt('Amount received ₹',p?.receivedAmount||0);if(n===null)return;n=Number(n);if(!p||!Number.isFinite(n)||n<0||n>Number(p.dueAmount))return alert('Invalid amount.');await updateDoc(doc(db,'payments',id),{receivedAmount:n,status:n===0?'pending':n<Number(p.dueAmount)?'partial':'paid',verifiedBy:user.uid,verifiedAt:serverTimestamp()});await refresh();render()}
function payView(v){let m=members[0];v.innerHTML=`<div class="panel"><h2>Pay monthly contribution</h2><p>Monthly amount: <b>${money(m?.monthlyAmount)}</b></p><p>Admin UPI ID: <b>${esc(settings.adminUpi||'Not configured')}</b></p><div class="notice">After paying, submit the UPI reference. Payment stays pending until admin verifies it in their bank/UPI app.</div><button id="upiBtn" ${settings.adminUpi?'':'disabled'}>Open UPI app</button><label>Month (YYYY-MM)</label><input id="payMonth" value="${monthNow()}"><label>Amount paid ₹</label><input id="payAmount" type="number" value="${m?.monthlyAmount||''}"><label>UPI transaction reference / UTR</label><input id="payRef"><button id="submitRef">Submit payment reference</button><div id="payMsg" class="muted"></div></div>`;$('upiBtn').onclick=()=>location.href=`upi://pay?pa=${encodeURIComponent(settings.adminUpi)}&pn=Committee%20Admin&am=${encodeURIComponent($('payAmount').value)}&cu=INR&tn=${encodeURIComponent('Committee '+$('payMonth').value)}`;$('submitRef').onclick=async()=>{try{let ref=$('payRef').value.trim(),month=$('payMonth').value,amount=Number($('payAmount').value);if(!ref||!/^[0-9]{4}-[0-9]{2}$/.test(month)||amount<=0)throw Error('Enter month, amount and transaction reference.');await addDoc(collection(db,'paymentRequests'),{memberUid:user.uid,memberId:profile.memberId,month,amount,reference:ref,status:'submitted',createdAt:serverTimestamp()});message('payMsg','Reference submitted. Admin must verify the transaction.','success')}catch(e){message('payMsg',err(e))}}
async function loadRequests(){try{let q=await getDocs(query(collection(db,'paymentRequests'),where('status','==','submitted')));$('requests').innerHTML=q.docs.map(d=>{let r=d.data(),m=members.find(x=>x.uid===r.memberUid);return `<div class="item"><b>${esc(m?.name||'Member')} • ${esc(r.month)}</b><div class="muted">${money(r.amount)} • Ref: ${esc(r.reference)}</div><button class="small" data-verify="${d.id}">Verify and mark received</button></div>`}).join('')||'<p class="muted">No submitted references.</p>';$('requests').querySelectorAll('[data-verify]').forEach(b=>b.onclick=async()=>{let r=q.docs.find(d=>d.id===b.dataset.verify).data();if(!confirm('Only confirm after checking your actual bank/UPI transaction. Mark received?'))return;let p=payments.find(x=>x.memberUid===r.memberUid&&x.month===r.month);if(p){let n=Math.min(Number(p.dueAmount),Number(p.receivedAmount||0)+Number(r.amount));await updateDoc(doc(db,'payments',p.id),{receivedAmount:n,status:n>=Number(p.dueAmount)?'paid':'partial',verifiedBy:user.uid,verifiedAt:serverTimestamp()})}else await addDoc(collection(db,'payments'),{memberUid:r.memberUid,memberId:r.memberId,month:r.month,dueAmount:r.amount,receivedAmount:r.amount,status:'paid',verifiedBy:user.uid,verifiedAt:serverTimestamp()});await updateDoc(doc(db,'paymentRequests',b.dataset.verify),{status:'verified',verifiedBy:user.uid,verifiedAt:serverTimestamp()});await refresh();render()})}catch(e){$('requests').textContent=err(e)}}
async function wheelView(v){let cycle=settings.cycleId||'cycle-1',eligible=members.filter(m=>m.lastWinnerCycle!==cycle);v.innerHTML=`<div class="panel"><h2>Monthly winner wheel</h2><p class="muted">Eligible members this cycle: ${eligible.length}</p><div class="wheel" id="wheelFace">Spin to choose<br>one eligible member</div><button id="spinBtn" ${eligible.length?'':'disabled'}>SPIN THE WHEEL</button><div id="winnerMsg" class="muted"></div><h3>Winner history</h3><div id="history">Loading…</div><button id="newCycle" class="secondary">Start new cycle</button></div>`;loadHistory();$('spinBtn').onclick=async()=>{if(!eligible.length)return;let w=eligible[Math.floor(Math.random()*eligible.length)];await addDoc(collection(db,'winners'),{memberId:w.id,memberUid:w.uid,name:w.name,cycleId:cycle,month:monthNow(),selectedBy:user.uid,createdAt:serverTimestamp()});await updateDoc(doc(db,'members',w.id),{lastWinnerCycle:cycle});message('winnerMsg','Winner: '+w.name,'success');await refresh();render()};$('newCycle').onclick=async()=>{if(!confirm('Start a new cycle and reset eligibility?'))return;await setDoc(doc(db,'settings','main'),{...settings,cycleId:'cycle-'+Date.now()},{merge:true});for(let m of members)await updateDoc(doc(db,'members',m.id),{lastWinnerCycle:null});await refresh();render()}}
async function loadHistory(){try{let q=await getDocs(collection(db,'winners'));$('history').innerHTML=q.docs.map(d=>d.data()).sort((a,b)=>(b.month||'').localeCompare(a.month||'')).map(w=>`<div class="item"><b>${esc(w.name)}</b><div class="muted">${esc(w.month)} • ${esc(w.cycleId)}</div></div>`).join('')||'No winners yet.'}catch(e){$('history').textContent=err(e)}}
function settingsView(v){v.innerHTML=`<div class="panel"><h2>Committee settings</h2><label>Admin UPI ID (VPA)</label><input id="adminUpi" placeholder="yourname@upi" value="${esc(settings.adminUpi||'')}"><label>Committee cycle ID</label><input id="cycleId" value="${esc(settings.cycleId||'cycle-1')}"><button id="saveSettings">Save settings</button><div id="settingsMsg" class="muted"></div></div><div class="notice">UPI deep links do not verify payment. Never share private credentials.</div>`;$('saveSettings').onclick=async()=>{try{let upi=$('adminUpi').value.trim();if(upi&&!/^[\w.\-]{2,256}@[a-zA-Z]{2,64}$/.test(upi))throw Error('Check UPI ID format.');await setDoc(doc(db,'settings','main'),{adminUpi:upi,cycleId:$('cycleId').value.trim()||'cycle-1'},{merge:true});await refresh();message('settingsMsg','Saved.','success')}catch(e){message('settingsMsg',err(e))}}
</script></body></html>
